<div class="modallogin">
  <div class="card p-4">
    <div class="form-container">
      <h2>Ingresa a UrbanView</h2>
      <form [formGroup]="loguin" (ngSubmit)="onVerificar()">
        <div class="mb-3">
          <label for="username" class="text-light">Correo electrónico</label>
          <input type="email" id="username" formControlName="user" autocomplete="username" class="form-control" [readOnly]="codeSent" required>
        </div>
        <div class="mb-3">
          <label for="password" class="text-light">Contraseña</label>
          <input type="password" id="password" formControlName="password" autocomplete="current-password" class="form-control" [readOnly]="codeSent" required>
        </div>
        <div *ngIf="codeSent" class="mb-3 text-light">
          <p>Enviamos un código a tu correo. Ingresa los seis dígitos para completar el inicio de sesión.</p>
          <label for="verification-code">Código de verificación</label>
          <input id="verification-code" [formControl]="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="form-control">
          <button type="button" class="btn btn-link" (click)="requestNewCode()" [disabled]="busy">Solicitar otro código o cambiar correo</button>
        </div>
        <p *ngIf="error" role="alert" class="text-warning">{{ error }}</p>
        <button type="submit" class="btn btn-primary w-100" [disabled]="busy || loguin.invalid || (codeSent && code.invalid)">
          {{ busy ? 'Procesando…' : codeSent ? 'Verificar e ingresar' : 'Enviar código' }}
        </button>
        <p class="mt-3 text-light">¿No tienes cuenta? <a routerLink="/registrar">Regístrate</a></p>
        <a routerLink="/home">Volver al inicio</a>
      </form>
    </div>
  </div>
</div>
