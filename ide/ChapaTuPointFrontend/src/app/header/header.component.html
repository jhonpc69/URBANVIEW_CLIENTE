<!-- Modal de chido pa las notis -->

<div id="notificationModal" class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Notificaciones</h5>
        <button type="button" class="btn-close" (click)="closeNotificationModal()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="!userName">
          <p>Por favor, <a [routerLink]="'/login'">inicia sesión</a> para recibir notificaciones.</p>
        </div>
        <div *ngIf="userName && notifications.length === 0">
          <p>Aún no tienes notificaciones.</p>
        </div>
        <div *ngIf="userName && notifications.length > 0">
          <div *ngFor="let notification of notifications" [ngClass]="getNotificationClass(notification.estado)">
            <p><strong>{{ notification.nombreLocal }}</strong></p>
            <p>Tu solicitud está en: {{ notification.estado }}</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeNotificationModal()">Cerrar</button>
      </div>
    </div>
  </div>
</div>
