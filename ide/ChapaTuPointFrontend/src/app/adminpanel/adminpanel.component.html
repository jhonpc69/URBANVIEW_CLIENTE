<div class="container mt-4">
  <h2 class="mb-4" style="color: aliceblue;">Solicitudes</h2>
  <div class="row">
    <div class="col-md-4" *ngFor="let solicitud of items">
      <div class="card mb-4 shadow-sm card-fixed-size">
        <div class="card-img-top-container">
          <img *ngIf="solicitud.imagenes.length" [src]="solicitud.imagenes[0]" class="card-img-top" alt="Imagen de la solicitud">
          <div *ngIf="!solicitud.imagenes.length" class="no-image">
            <i class="fas fa-ban"></i>
            <p>Sin imagen</p>
          </div>
        </div>
        <div class="card-body" style="color: #1a1c40;">
          <h5 class="card-title text-truncate">{{ solicitud.nombreLocal }}</h5>
          <p class="card-text text-truncate">{{ solicitud.descripcion }}</p>
          <button class="btn btn-primary" (click)="openModal(solicitud)">Validar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-solicitud-modal [solicitud]="selectedSolicitud"></app-solicitud-modal>
