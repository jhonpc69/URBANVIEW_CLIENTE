<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-10">
      <input type="text" class="form-control" placeholder="Descripción" [(ngModel)]="descripcion">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" (click)="createCategoria()">Añadir</button>
    </div>
  </div>

  <table class="table table-dark table-striped">
    <thead>
      <tr>
        <th>Nombre de la Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let categoria of categorias">
        <td>{{ categoria.nombreCategoria }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="deleteCategoria(categoria.idCategoria)">Borrar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
