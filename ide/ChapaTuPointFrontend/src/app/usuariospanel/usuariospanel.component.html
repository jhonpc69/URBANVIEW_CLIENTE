<div class="input-group mb-3">
    <span class="input-group-text"><i class="fa fa-search"></i></span>
    <input type="text" class="form-control" placeholder="Buscar usuarios..." [(ngModel)]="searchQuery" (input)="search()">
  </div>
  
  <div class="container mt-4">
    <h2>Usuarios</h2>
    <table class="table table-dark table-striped">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of filteredUsuarios">
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.email }}</td>
          <td>{{ usuario.rol }}</td>
          <td>
            <button *ngIf="usuario.rol !== 'admin'" class="btn btn-primary btn-sm" (click)="asignarRolAdmin(usuario.idUsuario)">Asignar Rol Admin</button>
            <button *ngIf="usuario.rol === 'admin'" class="btn btn-danger btn-sm" (click)="eliminarRolAdmin(usuario.idUsuario)">Eliminar Rol Admin</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
