<div class="admin-container bg-dark text-light">
    <div class="sidebar p-3">
        <div class="section mb-4">
            <h3 class="text-light">Solicitudes</h3>
            <button class="btn custom-btn w-100 mb-2" (click)="loadComponent('adminpanel')">
                <i class="fa fa-home"></i> Locales
            </button>
        </div>
        <div class="section">
            <h3 class="text-light">Mantenimiento</h3>
            <button class="btn custom-btn w-100 mb-2" (click)="loadComponent('categorias')">
                <i class="fa fa-list"></i> Categorias
            </button>
            <button class="btn custom-btn w-100 mb-2" (click)="loadComponent('localesmatenimeinto')">
                <i class="fa fa-home"></i> Locales
            </button>
            <button class="btn custom-btn w-100 mb-2" (click)="loadComponent('usuariospanel')">
                <i class="fa fa-user"></i> Usuarios
            </button>
        </div>
    </div>
    <div class="content p-3 bg-custom-content text-light">
        <ng-container *ngIf="currentComponent === 'adminpanel'">
            <app-adminpanel></app-adminpanel>
        </ng-container>
        <ng-container *ngIf="currentComponent === 'categorias'">
            <app-categorias></app-categorias>
        </ng-container>
        <ng-container *ngIf="currentComponent === 'localesmatenimeinto'">
            <app-localesmatenimeinto></app-localesmatenimeinto>
        </ng-container>
        <ng-container *ngIf="currentComponent === 'usuariospanel'">
            <app-usuariospanel></app-usuariospanel>
        </ng-container>

    </div>
</div>
