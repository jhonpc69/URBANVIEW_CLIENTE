<div class="container mt-4">
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa fa-search"></i></span>
    <input type="text" class="form-control" placeholder="Buscar locales..." [(ngModel)]="searchQuery" (input)="search()">
  </div>
  
    <table class="table table-dark table-striped">
      <thead>
        <tr>
          <th>Título</th>
          <th>Descripción</th>
          <th>Hora Apertura</th>
          <th>Hora Cierre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let local of filteredLocales">
          <td>{{ local.nombreLocal }}</td>
          <td>{{ local.descripcion }}</td>
          <td>{{ local.horaApertura }}</td>
          <td>{{ local.horaCierre }}</td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="deleteLocal(local.idLocal)">Borrar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
